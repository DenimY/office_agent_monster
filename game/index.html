<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>office_agent_monster — Cave Office (v0)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>office_agent_monster</h1>
        </div>
        <p class="tagline" data-i18n="tagline">동굴 속 픽셀 오피스 — 몬스터를 클릭하세요</p>
        <div class="chrome-actions">
          <button type="button" id="lang-toggle" class="lang-btn" aria-label="Language">KO / EN</button>
        </div>
      </header>

      <main class="stage">
        <canvas id="game" width="960" height="640" aria-label="Cave office map"></canvas>
        <aside id="inspect" class="inspect" hidden>
          <button type="button" id="inspect-close" class="inspect-close" aria-label="Close">×</button>
          <div class="inspect-code" id="inspect-code"></div>
          <h2 id="inspect-name"></h2>
          <dl>
            <div>
              <dt data-i18n="role">역할</dt>
              <dd id="inspect-role"></dd>
            </div>
            <div>
              <dt data-i18n="task">현재 작업</dt>
              <dd id="inspect-task"></dd>
            </div>
            <div>
              <dt data-i18n="status">상태</dt>
              <dd id="inspect-status"></dd>
            </div>
          </dl>
        </aside>
      </main>

      <footer class="hint" data-i18n="hint">클릭: 몬스터 선택 · 몬스터는 책상 사이를 돌아다닙니다</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
